# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml
#variables:
# Mode: "Development"
stages: # List of stages for jobs, and their order of execution
  - build
  - deploy

build-job: # This job runs in the build stage, which runs first.
  stage: build
  tags: 
    - build
  # ASPNETCORE_ENVIRONMENT= Production
  image: docker:20.10.16
  services:
    - docker:-dind
  variables:
    address: https://nexus.entekhabeman.com/repository/nexus-docker/
    DOCKER_TLS_CERTDIR: "/certs"
    Mode: "Production"

  before_script:
    #- docker login registry.gitlab.com -u mohsen -p 4eD8mtETEAv97TsVYXwW
    - IMAGE_ID=$(docker images -q supplier)
    #- docker rmi -f $IMAGE_ID
    - if docker images | grep -q supplier; then docker rmi -f supplier; fi
    - docker login https://nexus.entekhabeman.com/repository -u $nexus_user -p $nexus_pass
      #  - sudo apt-get install npm
  script:
    - echo $Mode
    - export Mode=$Mode
    - docker build --build-arg Mode=$Mode -t supplier . -f ./src/EndPoint/Em.Ms.SupplierService.EndPoint.Api/Dockerfile
    - docker tag supplier:latest nexus.entekhabeman.com/repository/devproject/supplier:latest
    - docker push nexus.entekhabeman.com/repository/devproject/supplier:latest

    - docker build --build-arg Mode=$Mode -t supplierbackground . -f ./src/EndPoint/Em.Ms.SupplierService.EndPoint.Background/Dockerfile
    - docker tag supplierbackground:latest nexus.entekhabeman.com/repository/devproject/supplierbackground:latest
    - docker push nexus.entekhabeman.com/repository/devproject/supplierbackground:latest
      # - docker build -t registry.gitlab.com/mohsengroup/project . -f ./Dockerfile.conf
      # - docker build -t $Image_name_n:$Image_Tag_n . -f ./dockerfile
      # - docker build -t $IMAGE_NAME:$IMAGE_TAG -f docker/"$1".dockerfile .
      # - docker push $IMAGE_NAME:$iMAGE_TAG
  only:
    - develop

deploy-job:
  stage: deploy
  tags: 
    - kuber-tag
  image: ubuntu:20.04
  script:
   - kubectl rollout restart deployment supplier supplier-background
  only: 
   - develop

